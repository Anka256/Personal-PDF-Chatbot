[project]
name = "personal-pdf-chatbot"
version = "0.1.0"
description = "A PDF-based AI question-answering system that answers questions strictly using the content of the uploaded document."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.2",
    "pypdf>=6.16.1",
    "streamlit>=1.61.1",
]
